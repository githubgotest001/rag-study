# 一键启动：docker compose up --build
# 启动后访问 http://localhost:5173（前端），后端 API 在 http://localhost:8000
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./samples:/samples:ro        # 示例文档（首次启动自动入库）
      - backend-data:/app/data       # 向量库与文档注册表持久化
      - hf-cache:/root/.cache        # embedding 模型缓存（避免每次重建都下载）
    environment:
      # 可选：在宿主机导出这些变量即可接入 OpenAI 兼容 LLM
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
  hf-cache:
