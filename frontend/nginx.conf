server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API 请求转发给后端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 20m;
    }

    # 前端单页应用
    location / {
        try_files $uri $uri/ /index.html;
    }
}
